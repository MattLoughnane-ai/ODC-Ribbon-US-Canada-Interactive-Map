  .chip.central{ border-left: 3px solid #66BB6A; }
  .chip.west   { border-left: 3px solid #EF5350; }
  .chip.intl   { border-left: 3px solid #CE93D8; }

  #controls { background: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #ddd; }
  .filter-btn { border: 1.5px solid #ccc; background: #fff; border-radius: 20px; padding: 5px 16px; font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
  .filter-btn:hover { background: #f5f5f5; }
  .filter-btn.active { color: #fff; border-color: transparent; }
  .filter-btn.active.all     { background: #444; }
  .filter-btn.active.east    { background: #1E88E5; }
  .filter-btn.active.central { background: #43A047; }
  .filter-btn.active.west    { background: #E53935; }
  .filter-btn.active.intl    { background: #8E24AA; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #search-wrap { margin-left: auto; }
  #search { border: 1px solid #ccc; border-radius: 20px; padding: 5px 14px; font-size: 12px; width: 200px; outline: none; }
  #search:focus { border-color: #1E88E5; }

  #map { height: calc(100vh - 110px); width: 100%; }

  .legend { background: white; padding: 10px 14px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-size: 12px; line-height: 2; min-width: 130px; }
  .legend b { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #666; display: block; margin-bottom: 4px; }
  .legend-row { display: flex; align-items: center; gap: 8px; }
  .ldot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  .leaflet-popup-content-wrapper { border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); padding: 0; overflow: hidden; min-width: 260px; }
  .leaflet-popup-content { margin: 0; width: auto !important; }
  .popup-inner { padding: 14px 16px; }
  .popup-name { font-size: 15px; font-weight: 700; color: #1a1a2e; margin-bottom: 2px; }
  .popup-region { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .popup-region.east    { color: #1E88E5; }
  .popup-region.central { color: #43A047; }
  .popup-region.west    { color: #E53935; }
  .popup-region.intl    { color: #8E24AA; }
  .popup-row { font-size: 12px; color: #444; margin: 4px 0; display: flex; gap: 8px; align-items: flex-start; }
  .popup-label { color: #999; min-width: 52px; font-size: 11px; padding-top: 1px; }
  .popup-actions { display: flex; gap: 8px; margin-top: 12px; }
  .popup-btn { flex: 1; text-align: center; padding: 7px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; }
  .popup-btn.website { background: #1a1a2e; color: #fff; }
  .popup-btn.email   { background: #f0f4ff; color: #1E88E5; }
  .popup-btn:hover { opacity: 0.85; }
  .popup-header { height: 4px; }
  .popup-header.east    { background: #1E88E5; }
  .popup-header.central { background: #43A047; }
  .popup-header.west    { background: #E53935; }
  .popup-header.intl    { background: #8E24AA; }
</style>

let map, markers = [], currentFilter = 'all';

function makeIcon(region) {
  const c = COLORS[region];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="${c}" stroke="white" stroke-width="1.5"/></svg>`;
  return L.divIcon({ html: svg, className:'', iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-10] });
}

function popupHTML(d) {
  const name    = d[0];
  const region  = d[2];
  const address = d[5];
  const phone   = d[6];
  const website = d[7];
  const email   = d[8];
  const ws = website ? `<button class="popup-btn website" onclick="window.open('${website}','_blank')">🌐 Website</button>` : '';
  const em = email   ? `<a class="popup-btn email" href="mailto:${email}">✉ Email</a>` : '';
  return `<div class="popup-header ${region}"></div>
<div class="popup-inner">
  <div class="popup-name">${name}</div>
  <div class="popup-region ${region}">${LABELS[region]}</div>
  ${address ? `<div class="popup-row"><span class="popup-label">Address</span><span>${address}</span></div>` : ''}
  ${phone   ? `<div class="popup-row"><span class="popup-label">Phone</span><span>${phone}</span></div>` : ''}
  ${email   ? `<div class="popup-row"><span class="popup-label">Email</span><span style="word-break:break-all">${email}</span></div>` : ''}
  ${(ws||em) ? `<div class="popup-actions">${ws}${em}</div>` : ''}
</div>`;
}

window.onload = function() {
  map = L.map('map', { center:[39.5,-96], zoom:4, zoomControl:true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap contributors', maxZoom:18
  }).addTo(map);

  const legend = L.control({ position:'bottomright' });
  legend.onAdd = () => {
    const d = L.DomUtil.create('div','legend');
    d.innerHTML = `<b>Regions</b>
      <div class="legend-row"><span class="ldot" style="background:#1E88E5"></span>East</div>
      <div class="legend-row"><span class="ldot" style="background:#43A047"></span>Central</div>
      <div class="legend-row"><span class="ldot" style="background:#E53935"></span>West</div>
      <div class="legend-row"><span class="ldot" style="background:#8E24AA"></span>Canada / Intl</div>`;
    return d;
  };
  legend.addTo(map);

  DATA.forEach(d => {
    const m = L.marker([d[3],d[4]], { icon: makeIcon(d[2]) })
      .bindPopup(popupHTML(d), { maxWidth:300, minWidth:260 })
      .bindTooltip(`<b>${d[0]}</b><br><small>${LABELS[d[2]]}</small>`, { direction:'top', offset:[0,-8] });
    m._region = d[2];
    m.addTo(map);
    markers.push(m);
  });
};

function filter(region, btn) {
  currentFilter = region;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = 'filter-btn ' + b.className.split(' ').filter(c=>['east','central','west','intl','all'].includes(c)).join(' ');
  });
  btn.classList.add('active');
  let shown = 0;
  markers.forEach(m => {
    if (region === 'all' || m._region === region) { m.addTo(map); shown++; }
    else map.removeLayer(m);
  });
  document.getElementById('cnt-total').textContent = `Showing: ${shown}`;
}

function searchLoc(val) {
  const q = val.toLowerCase().trim();
  let shown = 0;
  markers.forEach((m,i) => {
    const d = DATA[i];
    const match = !q || d[0].toLowerCase().includes(q) || d[6].toLowerCase().includes(q) || d[1].toLowerCase().includes(q);
    const regionOk = currentFilter === 'all' || m._region === currentFilter;
    if (match && regionOk) { m.addTo(map); shown++; }
    else map.removeLayer(m);
  });
  document.getElementById('cnt-total').textContent = q ? `Results: ${shown}` : `Total: 429`;
}
